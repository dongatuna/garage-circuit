with them. The man maker\u2019s entry ramp."},kb_bear_complex:{name:"KB Bear Complex",eq:"KB 35",pose:"press",group:"cond",muscles:["fullbody","quads","shoulders"],rx:"4 / arm",cue:"Clean \u2192 front squat \u2192 press, unbroken, then switch arms."},squat_clean_thruster:{name:"Squat Clean Thruster",eq:"2\xD7 DB 20",pose:"squat",group:"cond",muscles:["fullbody","quads","shoulders"],rx:"8 reps",cue:"From the floor: clean into a squat, drive straight into the press."},donkey_kick:{name:"Donkey Kick",eq:"Bodyweight",pose:"donkeykick",group:"hinge",muscles:["glutes"],rx:"12 / leg",cue:"All fours, knee bent 90\xB0 \u2014 drive the sole to the ceiling. Squeeze 1s, no back arch."},fire_hydrant:{name:"Fire Hydrant",eq:"BW (band optional)",pose:"firehydrant",group:"hinge",muscles:["glutes"],rx:"12 / leg",cue:"All fours \u2014 bent knee lifts to the side. Hips stay square. Light/medium band above knees when it arrives."},fh_kick:{name:"Fire Hydrant Kick",eq:"BW (band optional)",pose:"firehydrant",group:"hinge",muscles:["glutes"],rx:"10 / leg",cue:"Lift to the side, then kick straight out. Two-part move, controlled back in."},clamshell:{name:"Clamshell",eq:"BW (band optional)",pose:"sidelying",group:"hinge",muscles:["glutes"],rx:"15 / side",cue:"Side-lying, knees bent, feet together \u2014 open the top knee like a shell. Light band, slow tempo."},side_leg_raise:{name:"Side-Lying Leg Raise",eq:"Bodyweight",pose:"sidelying",group:"hinge",muscles:["glutes"],rx:"15 / side",cue:"Straight top leg, heel leads, lift to 45\xB0. Don\u2019t roll backward."},lateral_band_walk:{name:"Lateral Band Walk",eq:"Band (or BW squat-walk)",pose:"squat",group:"legs",muscles:["glutes","quads"],rx:"12 steps / dir",cue:"Quarter squat, medium band above knees, step wide \u2014 knees pushed out the whole way."},jumping_jacks:{name:"Jumping Jacks",eq:"Bodyweight",pose:"jump",group:"cond",muscles:["fullbody","calves"],rx:"45 sec",sec:45,cue:"Full arm swing, light feet."},skaters:{name:"Skater Hops",eq:"Bodyweight",pose:"lunge",group:"cond",muscles:["glutes","quads","fullbody"],rx:"40 sec",sec:40,cue:"Bound side to side, stick each landing."},squat_thrust:{name:"Squat Thrust",eq:"Bodyweight",pose:"jump",group:"cond",muscles:["fullbody","core"],rx:"12 reps",cue:"Burpee without the push-up \u2014 kick back, snap in, stand."},shadow_boxing:{name:"Shadow Boxing",eq:"Bodyweight",pose:"press",group:"cond",muscles:["shoulders","core","fullbody"],rx:"45 sec",sec:45,cue:"Stay on your toes, breathe out on every punch."},du_rope_whip:{name:"Rope Whip Bursts",eq:"Jump rope",pose:"halo",group:"du",muscles:["shoulders","core"],rx:"10 \xD7 10 s",sec:118,bursts:{work:10,rest:2,sets:10},cue:"No jumping. Max-speed wrist spin 10 s, 2 s reset, ten rounds. Builds the whip."},du_high_bounce:{name:"High Singles",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"Jump 2\u20133 inches up, body straight, elbows in, land soft. This is the DU jump shape."},du_slow_rope_high:{name:"Slow-Rope High Jump",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"90 sec",sec:90,cue:"Every 10th jump: extra high, let the rope slow beneath you. Feel the hang time."},du_penguin:{name:"Penguin Drill",eq:"Bodyweight",pose:"jump",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"No rope. Jump, clap thighs twice at hip height before landing. Two claps = two rope passes."},du_targeted:{name:"Targeted Attempts (5:1)",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"90 sec",sec:90,cue:"5 singles \u2192 1 DU attempt \u2192 reset. Jump straight up; wrists fire as toes leave the ground."},du_1112:{name:"1-1-1-2 Pattern",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"2 min",sec:120,cue:"Single, single, single, DOUBLE. Jazz rhythm \u2014 three even beats, then the accent."},du_bounce:{name:"Vertical Bounce Singles",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"Perfectly vertical, tall and stiff, zero boxer-step drift."},du_groove:{name:"Grease the Groove",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"2 min",sec:120,cue:"10 singles \u2192 1 attempt \u2192 stop, breathe 15 s. Land one clean? Try 2 next. Land 2? Try 3."},du_max_test:{name:"Max DU Test",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"60 sec",sec:60,cue:"Best unbroken run. Count it, write it down, beat it next cycle."},du_3min_test:{name:"3-Min DU Total Test",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"3 min",sec:180,cue:"Count every successful DU in 3 minutes of attempts. Your volume score."},du_ladder:{name:"DU Ladder (2-3-4-5)",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"2 min",sec:120,cue:"Land 2 in a row \u2192 reset \u2192 try 3 \u2192 reset \u2192 4. Climb the ladder, no max-outs."},du_unbroken:{name:"Unbroken DU Sets",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"90 sec",sec:90,cue:"String as many consecutive as form allows. Break clean, breathe, go again."},du_10to1:{name:"10:1 Attempts",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"2 min",sec:120,cue:"10 singles \u2192 1 DU \u2192 keep the rope moving. Rhythm never stops."},du_boxer_flush:{name:"Boxer Step Flush",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves"],rx:"60 sec",sec:60,cue:"Easy rhythm, drop the shoulders, flush the calves."},du_free_jump:{name:"Free Jump",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"2 min",sec:120,cue:"Easy singles. Notice if anything in your movement has changed."},side_bend_db:{name:"Standing Side Bend",eq:"DB 15\u201325",pose:"twist",group:"core",muscles:["obliques"],rx:"15 / side",cue:"DB in one hand, reach straight down that side, come back to vertical \u2014 no leaning forward."},side_bend_kb:{name:"KB Suitcase Side Bend",eq:"K "hinge",muscles:["hamstrings","glutes","obliques"],rx:"10 / side",cue:"Bell in one hand, hips square \u2014 resist rotating as you hinge."},hip_thrust:{name:"KB Hip Thrust",eq:"KB 35",pose:"bridge",group:"hinge",muscles:["glutes","hamstrings"],rx:"15 reps",cue:"Shoulders on the floor, bell on hips, drive through heels, squeeze at lockout."},banded_good_morning:{name:"DB Good Morning",eq:"DB 25",pose:"hinge",group:"hinge",muscles:["hamstrings","lowerback"],rx:"12 reps",cue:"DB across shoulders like a bar, hinge slow, flat back."},reverse_hyper_sub:{name:"Prone Hip Extension",eq:"Bodyweight",pose:"prone",group:"hinge",muscles:["glutes","hamstrings","lowerback"],rx:"15 reps",cue:"Face down, lift both legs together from the hips, squeeze glutes at the top."},broad_jump_hinge:{name:"KB Swing to Squat",eq:"KB 35",pose:"swing",group:"hinge",muscles:["glutes","hamstrings","quads"],rx:"10 reps",cue:"Swing to chest height, catch and drop straight into a squat."},sl_deadlift_bw:{name:"Bodyweight Single-Leg RDL",eq:"Bodyweight",pose:"hinge",group:"hinge",muscles:["hamstrings","glutes"],rx:"10 / leg",cue:"No weight, just balance and hip hinge control \u2014 great warm-up primer."},incline_pushup:{name:"Incline Push-Up",eq:"Bodyweight",pose:"pushup",group:"push",muscles:["chest","shoulders"],rx:"15 reps",cue:"Hands elevated on a box or step, easier variation, full range."},decline_pushup:{name:"Decline Push-Up",eq:"Bodyweight",pose:"pushup",group:"push",muscles:["chest","shoulders"],rx:"10 reps",cue:"Feet elevated, harder variation, more shoulder load."},db_bench_squeeze:{name:"DB Floor Fly Squeeze",eq:"2\xD7 DB 15",pose:"fly",group:"push",muscles:["chest"],rx:"12 reps",cue:"Lying down, arc up and squeeze the bells together at the top, hold 1s."},kb_floor_press:{name:"Double KB Floor Press",eq:"2\xD7 KB 35",pose:"floorpress",group:"push",muscles:["chest","triceps","shoulders"],rx:"10 reps",cue:"Both bells press together off the floor. Elbows touch down, drive to lockout \u2014 the bench press you don\u2019t need a bench for."},kb_alt_floor_press:{name:"Alternating KB Floor Press",eq:"2\xD7 KB 35",pose:"floorpress",group:"push",muscles:["chest","triceps","core"],rx:"8 / arm",cue:"Both bells locked out. Lower ONE while the other stays braced upright, press it back, then switch. The static arm is working the whole time."},kb_single_floor_press:{name:"Single-Arm KB Floor Press",eq:"KB 35",pose:"floorpress",group:"push",muscles:["chest","triceps","obliques"],rx:"10 / arm",cue:"One bell, free hand on the floor. Resist the twist \u2014 obliques fight the asymmetric load."},kb_crush_press:{name:"KB Crush Press",eq:"2\xD7 KB 35",pose:"floorpress",group:"push",muscles:["chest","triceps"],rx:"12 reps",cue:"Bells pressed hard together the entire rep \u2014 constant chest tension, not just at lockout."},db_alt_floor_press:{name:"Alternating DB Floor Press",eq:"2\xD7 DB 25",pose:"floorpress",group:"push",muscles:["chest","triceps","core"],rx:"10 / arm",cue:"Lighter version of the KB alternating press \u2014 same static-hold demand on the braced arm."},kb_chest_fly:{name:"KB Floor Fly",eq:"2\xD7 KB 35",pose:"fly",group:"push",muscles:["chest"],rx:"10 reps",cue:"Slight elbow bend, arc the bells wide until the upper arms touch down, squeeze back up."},db_pullover_chest:{name:"DB Chest Pullover",eq:"DB 25",pose:"floorpress",group:"push",muscles:["chest","back","core"],rx:"12 reps",cue:"Lying down, arc the bell back overhead, ribs pinned \u2014 stretches the chest under load."},kb_pushup_press:{name:"KB Push-Up to Floor Press",eq:"2\xD7 KB 35",pose:"pushup",group:"push",muscles:["chest","triceps","core"],rx:"8 reps",cue:"Push-up on the handles, roll to your back, floor press both, roll up. One brutal combo rep."},guillotine_pushup:{name:"Deficit Push-Up",eq:"2\xD7 KB 35",pose:"pushup",group:"push",muscles:["chest","shoulders"],rx:"10 reps",cue:"Hands on the bell handles so your chest sinks BELOW them \u2014 far bigger stretch than a floor push-up."},landmine_
