",cue:"Clean \u2192 front squat \u2192 press, unbroken, then switch arms."},squat_clean_thruster:{name:"Squat Clean Thruster",eq:"2\xD7 DB 20",pose:"squat",group:"cond",muscles:["fullbody","quads","shoulders"],rx:"8 reps",cue:"From the floor: clean into a squat, drive straight into the press."},donkey_kick:{name:"Donkey Kick",eq:"Bodyweight",pose:"donkeykick",group:"hinge",muscles:["glutes"],rx:"12 / leg",cue:"All fours, knee bent 90\xB0 \u2014 drive the sole to the ceiling. Squeeze 1s, no back arch."},fire_hydrant:{name:"Fire Hydrant",eq:"BW (band optional)",pose:"firehydrant",group:"hinge",muscles:["glutes"],rx:"12 / leg",cue:"All fours \u2014 bent knee lifts to the side. Hips stay square. Light/medium band above knees when it arrives."},fh_kick:{name:"Fire Hydrant Kick",eq:"BW (band optional)",pose:"firehydrant",group:"hinge",muscles:["glutes"],rx:"10 / leg",cue:"Lift to the side, then kick straight out. Two-part move, controlled back in."},clamshell:{name:"Clamshell",eq:"BW (band optional)",pose:"sidelying",group:"hinge",muscles:["glutes"],rx:"15 / side",cue:"Side-lying, knees bent, feet together \u2014 open the top knee like a shell. Light band, slow tempo."},side_leg_raise:{name:"Side-Lying Leg Raise",eq:"Bodyweight",pose:"sidelying",group:"hinge",muscles:["glutes"],rx:"15 / side",cue:"Straight top leg, heel leads, lift to 45\xB0. Don\u2019t roll backward."},lateral_band_walk:{name:"Lateral Band Walk",eq:"Band (or BW squat-walk)",pose:"squat",group:"legs",muscles:["glutes","quads"],rx:"12 steps / dir",cue:"Quarter squat, medium band above knees, step wide \u2014 knees pushed out the whole way."},jumping_jacks:{name:"Jumping Jacks",eq:"Bodyweight",pose:"jump",group:"cond",muscles:["fullbody","calves"],rx:"45 sec",sec:45,cue:"Full arm swing, light feet."},skaters:{name:"Skater Hops",eq:"Bodyweight",pose:"lunge",group:"cond",muscles:["glutes","quads","fullbody"],rx:"40 sec",sec:40,cue:"Bound side to side, stick each landing."},squat_thrust:{name:"Squat Thrust",eq:"Bodyweight",pose:"jump",group:"cond",muscles:["fullbody","core"],rx:"12 reps",cue:"Burpee without the push-up \u2014 kick back, snap in, stand."},shadow_boxing:{name:"Shadow Boxing",eq:"Bodyweight",pose:"press",group:"cond",muscles:["shoulders","core","fullbody"],rx:"45 sec",sec:45,cue:"Stay on your toes, breathe out on every punch."},du_rope_whip:{name:"Rope Whip Bursts",eq:"Jump rope",pose:"halo",group:"du",muscles:["shoulders","core"],rx:"10 \xD7 10 s",sec:118,bursts:{work:10,rest:2,sets:10},cue:"No jumping. Max-speed wrist spin 10 s, 2 s reset, ten rounds. Builds the whip."},du_high_bounce:{name:"High Singles",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"Jump 2\u20133 inches up, body straight, elbows in, land soft. This is the DU jump shape."},du_slow_rope_high:{name:"Slow-Rope High Jump",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"90 sec",sec:90,cue:"Every 10th jump: extra high, let the rope slow beneath you. Feel the hang time."},du_penguin:{name:"Penguin Drill",eq:"Bodyweight",pose:"jump",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"No rope. Jump, clap thighs twice at hip height before landing. Two claps = two rope passes."},du_targeted:{name:"Targeted Attempts (5:1)",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"90 sec",sec:90,cue:"5 singles \u2192 1 DU attempt \u2192 reset. Jump straight up; wrists fire as toes leave the ground."},du_1112:{name:"1-1-1-2 Pattern",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulders"],rx:"2 min",sec:120,cue:"Single, single, single, DOUBLE. Jazz rhythm \u2014 three even beats, then the accent."},du_bounce:{name:"Vertical Bounce Singles",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core"],rx:"60 sec",sec:60,cue:"Perfectly vertical, tall and stiff, zero boxer-step drift."},du_groove:{name:"Grease the Groove",eq:"Jump rope",pose:"rope",group:"du",muscles:["calves","core","shoulder
